<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printly · Estampados personalizados</title>
<meta name="description" content="Personaliza polos, poleras, tazas, tomatodos, llaveros y más con tu diseño.">
<link rel="icon" href="img/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..800,100&family=Figtree:wght@400;500;600;700&family=Caveat:wght@700&family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" data-act="go" data-view="shop" aria-label="Ir a la tienda"><img src="img/logo.webp" alt="Printly"></button>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<div id="banner"></div>
<main class="wrap" id="app"></main>
<footer class="foot" id="foot"></footer>
<div class="modal" id="modal" hidden></div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto del producto" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="js/catalogo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
